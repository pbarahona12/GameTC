# Verificación, compilación Android y publicación.
#
# Dos variantes del mismo juego (ver src/distribution.ts):
#   · play   → AAB para Google Play. Sin actualizaciones propias ni enlaces a APK
#              (`npm run build:play` lo comprueba sobre el paquete).
#   · github → APK de GitHub Releases, con las actualizaciones firmadas por internet.
#
# - En CUALQUIER rama y en pull requests: tipos, lint, pruebas, compilación de ambas
#   variantes, prueba de punta a punta (Playwright, sobre la de Play) y APK de prueba.
#   Nada se publica.
# - Solo en push a main (job "publicar"):
#     · Release v<versión> con la APK de GitHub y sus huellas SHA256SUMS, si existe la
#       llave propia de GitHub. Si la Release ya existe, NO se reemplaza.
#     · Actualización por internet firmada (ECDSA P-256) en la rama ota-channel, si está
#       el secreto URT_OTA_SIGNING_KEY. Sin firma no se publica nada.
#   El AAB de Play queda como artefacto del CI (para subirlo a Play Console), no en la Release.
#
# Firma: nunca con una llave de depuración ni con un certificado de
# android/compromised-signing-certs.txt (scripts/check-signing.sh lo rechaza).
#
# Secretos (Settings → Secrets and variables → Actions), ver docs/PUBLICAR.md:
#   Play (llave de subida):  URT_KEYSTORE_BASE64, URT_KEYSTORE_PASSWORD, URT_KEY_ALIAS, URT_KEY_PASSWORD (opcional)
#   GitHub (llave propia):   URT_GITHUB_KEYSTORE_BASE64, URT_GITHUB_KEYSTORE_PASSWORD, URT_GITHUB_KEY_ALIAS, URT_GITHUB_KEY_PASSWORD (opcional)
#   Actualizaciones:         URT_OTA_SIGNING_KEY
#
# El runner ubuntu-24.04 trae el SDK de Android en $ANDROID_HOME con las licencias aceptadas.
name: Android y publicación
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Compilaciones reproducibles: misma fecha de referencia para todo el contenido generado.
  SOURCE_DATE_EPOCH: 1767225600
  TZ: UTC

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HAS_RELEASE_KEY: ${{ secrets.URT_KEYSTORE_BASE64 != '' && secrets.URT_KEYSTORE_PASSWORD != '' && secrets.URT_KEY_ALIAS != '' }}
      HAS_GITHUB_KEY: ${{ secrets.URT_GITHUB_KEYSTORE_BASE64 != '' && secrets.URT_GITHUB_KEYSTORE_PASSWORD != '' && secrets.URT_GITHUB_KEY_ALIAS != '' }}
      # Anuncios reales solo en lo que se publica (push a main); en el resto, anuncios de prueba.
      VITE_ADS_LIVE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: "Versión (única fuente: package.json)"
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(node -p "require('./package.json').nativeCode")
          MIN=$(node -p "require('./package.json').otaMinNativeCode")
          test "$MIN" -le "$CODE" || { echo "::error::otaMinNativeCode ($MIN) no puede ser mayor que nativeCode ($CODE)"; exit 1; }
          grep -q "\"version\": \"$VERSION\"" src/content/changelog.json || { echo "::error::Falta la entrada $VERSION en src/content/changelog.json"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Compilación web para Google Play (sin actualizaciones propias ni enlaces a APK)
        run: npm run build:play
      - name: Prueba de punta a punta (Playwright, variante de Play)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Informe de Playwright (solo si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - run: npx cap sync android

      - name: SDK de Android preinstalado
        run: |
          test -d "$ANDROID_HOME" || { echo "::error::No se encontró el SDK de Android en el runner"; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/play" "$RUNNER_TEMP/github"

      - name: APK de prueba (llave de depuración del runner; NO se distribuye)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: AAB para Google Play (llave de subida)
        if: env.HAS_RELEASE_KEY == 'true'
        working-directory: android
        env:
          URT_KEYSTORE_BASE64: ${{ secrets.URT_KEYSTORE_BASE64 }}
          URT_KEYSTORE_PASSWORD: ${{ secrets.URT_KEYSTORE_PASSWORD }}
          URT_KEY_ALIAS: ${{ secrets.URT_KEY_ALIAS }}
          URT_KEY_PASSWORD: ${{ secrets.URT_KEY_PASSWORD }}
        run: |
          umask 077
          echo "$URT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/play.jks"
          trap 'rm -f "$RUNNER_TEMP/play.jks"' EXIT
          export URT_KEYSTORE_FILE="$RUNNER_TEMP/play.jks"
          ./gradlew bundleRelease --no-daemon --stacktrace
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" > /dev/null
          ../scripts/check-signing.sh "$AAB"
          # El paquete web DENTRO del AAB tampoco puede traer actualizaciones propias.
          rm -rf "$RUNNER_TEMP/aab-web" && mkdir -p "$RUNNER_TEMP/aab-web"
          unzip -q "$AAB" 'base/assets/public/*' -d "$RUNNER_TEMP/aab-web"
          node ../scripts/verifyDistribution.mjs play "$RUNNER_TEMP/aab-web"
          cp "$AAB" "$RUNNER_TEMP/play/ultimate-realistic-tycoon-play.aab"

      - name: Aviso de firma de Play
        if: env.HAS_RELEASE_KEY != 'true'
        run: echo "::notice title=Firma de Play::No se generó el AAB porque faltan los secretos URT_KEYSTORE_BASE64, URT_KEYSTORE_PASSWORD y URT_KEY_ALIAS. Ver docs/PUBLICAR.md."

      - name: Compilación web para GitHub (con actualizaciones firmadas)
        env:
          VITE_DISTRIBUTION: github
        run: |
          npm run build:github
          npx cap sync android

      - name: APK para GitHub Releases (llave propia de GitHub, distinta de la de Play)
        if: env.HAS_GITHUB_KEY == 'true'
        working-directory: android
        env:
          URT_KEYSTORE_BASE64: ${{ secrets.URT_GITHUB_KEYSTORE_BASE64 }}
          URT_KEYSTORE_PASSWORD: ${{ secrets.URT_GITHUB_KEYSTORE_PASSWORD }}
          URT_KEY_ALIAS: ${{ secrets.URT_GITHUB_KEY_ALIAS }}
          URT_KEY_PASSWORD: ${{ secrets.URT_GITHUB_KEY_PASSWORD }}
        run: |
          umask 077
          echo "$URT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/github.jks"
          trap 'rm -f "$RUNNER_TEMP/github.jks"' EXIT
          export URT_KEYSTORE_FILE="$RUNNER_TEMP/github.jks"
          ./gradlew assembleRelease --no-daemon --stacktrace
          APK=app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify "$APK"
          ../scripts/check-signing.sh "$APK"
          cp "$APK" "$RUNNER_TEMP/github/ultimate-realistic-tycoon.apk"

      - name: Aviso de firma de GitHub
        if: env.HAS_GITHUB_KEY != 'true'
        run: echo "::notice title=Firma de GitHub::No se generó la APK de GitHub porque faltan los secretos URT_GITHUB_KEYSTORE_BASE64, URT_GITHUB_KEYSTORE_PASSWORD y URT_GITHUB_KEY_ALIAS. La llave pública que se usaba hasta la 1.4.0 ya no firma nada. Ver docs/PUBLICAR.md."

      - name: Huellas SHA-256
        run: |
          for d in play github; do
            if ls "$RUNNER_TEMP/$d"/* > /dev/null 2>&1; then (cd "$RUNNER_TEMP/$d" && sha256sum * | tee SHA256SUMS); fi
          done

      - name: Artefacto de Play (AAB para subir a Play Console; no se publica en Releases)
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: play-${{ steps.ver.outputs.version }}
          path: ${{ runner.temp }}/play/
          if-no-files-found: error

      - name: Artefacto de GitHub (APK que se publica en Releases)
        if: env.HAS_GITHUB_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: github-${{ steps.ver.outputs.version }}
          path: ${{ runner.temp }}/github/
          if-no-files-found: error

  publicar:
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verificar.outputs.version }}
      HAS_OTA_KEY: ${{ secrets.URT_OTA_SIGNING_KEY != '' }}
      HAS_GITHUB_KEY: ${{ secrets.URT_GITHUB_KEYSTORE_BASE64 != '' && secrets.URT_GITHUB_KEYSTORE_PASSWORD != '' && secrets.URT_GITHUB_KEY_ALIAS != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        if: env.HAS_GITHUB_KEY == 'true'
        with:
          name: github-${{ needs.verificar.outputs.version }}
          path: out

      - name: Release v${{ needs.verificar.outputs.version }} (sin reemplazar una existente)
        if: env.HAS_GITHUB_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::warning title=Release ya publicada::$TAG ya existe y no se reemplaza. Para publicar cambios, subí la versión en package.json (y nativeCode si cambió algo nativo)."
            exit 0
          fi
          NOTES=$(node -e "const c=require('./src/content/changelog.json').find(e=>e.version===process.env.VERSION); console.log(c.items.map(i=>'- '+i).join('\n'))")
          printf '%s\n\n%s\n' "$NOTES" "La APK ultimate-realistic-tycoon.apk está firmada con la llave de GitHub (no con la llave pública que se usaba hasta la 1.4.0). Si tu instalación es anterior y Android no deja instalarla encima: exportá la partida (Ajustes → Guardado y copias), desinstalá la app vieja, instalá esta e importá la partida. Verificá la descarga con SHA256SUMS." > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" out/* --title "Ultimate Realistic Tycoon $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA" --latest

      - name: Aviso de Release
        if: env.HAS_GITHUB_KEY != 'true'
        run: echo "::notice title=Sin Release::No se publicó la Release porque falta la llave de GitHub (secretos URT_GITHUB_KEYSTORE_*). Ver docs/PUBLICAR.md."

      - uses: actions/setup-node@v5
        if: env.HAS_OTA_KEY == 'true'
        with:
          node-version: 22.22.2
          cache: npm

      - name: Actualización por internet firmada
        if: env.HAS_OTA_KEY == 'true'
        env:
          URT_OTA_SIGNING_KEY: ${{ secrets.URT_OTA_SIGNING_KEY }}
          VITE_ADS_LIVE: 'true'
          # La actualización por internet es para la APK de GitHub (scripts/ota.mjs lo comprueba).
          VITE_DISTRIBUTION: github
        run: |
          npm ci
          BUILD=$(node -p "const [a,b,c]=require('./package.json').version.split(/[.-]/).map(Number); a*10000+b*100+c")
          PUBLISHED=$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ota-channel/manifest.json" 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const e=JSON.parse(d);console.log(JSON.parse(Buffer.from(e.payload,'base64')).build)}catch{console.log(0)}})" || echo 0)
          if [ "$PUBLISHED" -ge "$BUILD" ]; then
            echo "::warning title=OTA ya publicada::El canal ya tiene la versión $PUBLISHED; no se reemplaza."
            exit 0
          fi
          node scripts/ota.mjs sign --out "$RUNNER_TEMP/ota"
          cd "$RUNNER_TEMP/ota"
          git init -q -b ota-channel
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "OTA $VERSION ($GITHUB_SHA)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ota-channel

      - name: Aviso de actualización por internet
        if: env.HAS_OTA_KEY != 'true'
        run: echo "::notice title=OTA sin publicar::Falta el secreto URT_OTA_SIGNING_KEY; la actualización por internet no se publicó (nunca se publica sin firmar). Ver docs/PUBLICAR.md."
