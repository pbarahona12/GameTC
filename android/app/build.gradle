import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Única fuente de la versión: package.json ("version" → versionName, "nativeCode" → versionCode).
def appPackage = new JsonSlurper().parse(rootProject.file('../package.json'))

android {
    namespace = "com.urt.tycoon"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.urt.tycoon"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appPackage.nativeCode as int
        versionName appPackage.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Compilaciones reproducibles: sin el bloque cifrado de dependencias dentro de la APK
    // (Play lo sigue recibiendo dentro del AAB).
    dependenciesInfo {
        includeInApk = false
        includeInBundle = true
    }
    // Firma:
    //  - debug: la llave de depuración por defecto de cada máquina (~/.android/debug.keystore).
    //    Las APK de depuración son solo para probar: NUNCA se distribuyen.
    //    Hasta la 1.4.0 el repositorio incluía una llave fija (urt-debug.keystore, contraseña
    //    pública) con la que se firmaban las APK de GitHub Releases. Como cualquiera podía
    //    firmar con ella, se retiró: ver docs/PUBLICAR.md §5 y android/compromised-signing-certs.txt.
    //  - release (AAB de Play y APK de GitHub): la llave real NUNCA se sube al repositorio.
    //    Se lee de variables de entorno (en GitHub, de los secretos del repositorio; el CI usa
    //    una llave distinta para Play y para GitHub). Sin ellas, la variante release queda sin
    //    firmar y el CI no la publica.
    signingConfigs {
        if (System.getenv('URT_KEYSTORE_FILE')) {
            release {
                storeFile file(System.getenv('URT_KEYSTORE_FILE'))
                storePassword System.getenv('URT_KEYSTORE_PASSWORD')
                keyAlias System.getenv('URT_KEY_ALIAS')
                keyPassword System.getenv('URT_KEY_PASSWORD') ?: System.getenv('URT_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv('URT_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
